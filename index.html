<!DOCTYPE html>
<html>
<body>
  
  <h2>Loan Calculator</h2>
  
 <p> Present Value - The amount you wish to borrow <input type="number" id="pv" value="number" ><br><br> </p>
 <p> Years <input type="number" id="n" value="number"><br><br> </p>
 <p>  % - Annual interest rate <input type="number" id="r" value="number"><br><br> </p>
  <button onclick="calculate()">Calculate</button>
  <p>Monthly Payment: $<span id="result">0.00</span></p>
  
  <script>
    function calculate() {
      const PV = parseFloat(document.getElementById('pv').value);
      const r = parseFloat(document.getElementById('r').value);
      const n = parseFloat(document.getElementById('n').value);
      const P = ((r/100/12) * PV) / (1 - (1 + (r/100/12)) ** -(n*12));
      document.getElementById('ans').innerText = "If you take a loan for $" + PV + "your payment will be $" + P.toFixed(2);
    }
  </script>
  
</body>
</html>
